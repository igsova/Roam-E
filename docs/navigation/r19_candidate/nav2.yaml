# OFFLINE R19 CAMERA-FORWARD CANDIDATE — NOT APPROVED FOR ROBOT USE.
# Not selected by any launch. Read ../R19_NAVIGATION_GEOMETRY_CANDIDATE.md.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.03
      required_movement_angle: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.08
      lookahead_dist: 0.18
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.3
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.6
      max_robot_pose_search_dist: 2.0
      stateful: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      footprint: '[[-0.143811,0.0383],[-0.14365,-0.0094],[-0.1422,-0.059293],[-0.138541,-0.077734],[-0.137369,-0.082698],[-0.134248,-0.086847],[-0.124453,-0.097544],[-0.122227,-0.099851],[-0.119835,-0.101988],[-0.117269,-0.103961],[-0.114518,-0.105775],[-0.111569,-0.107432],[-0.108405,-0.108936],[-0.09469,-0.114484],[-0.09463,-0.1145],[-0.07275,-0.11906],[-0.02975,-0.12],[-0.02425,-0.12],[0.02063,-0.1145],[0.02069,-0.114484],[0.034405,-0.108936],[0.037569,-0.107432],[0.0543,-0.099],[0.066995,-0.091],[0.0682,-0.059293],[0.06965,-0.0094],[0.06965,0.0094],[0.0682,0.059293],[0.066995,0.091],[0.060741,0.09485],[0.037569,0.107432],[0.034405,0.108936],[0.02069,0.114484],[0.02063,0.1145],[-0.0034,0.11895],[-0.0113,0.11905],[-0.06725,0.11906],[-0.07275,0.11906],[-0.09463,0.1145],[-0.09469,0.114484],[-0.108405,0.108936],[-0.111569,0.107432],[-0.114518,0.105775],[-0.117269,0.103961],[-0.119835,0.101988],[-0.128351,0.09485],[-0.131851,0.09175],[-0.137374,0.082675],[-0.138541,0.077734],[-0.1422,0.059293],[-0.143711,0.0496],[-0.143811,0.0417]]'
      footprint_padding: 0.01
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.22
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.143811,0.0383],[-0.14365,-0.0094],[-0.1422,-0.059293],[-0.138541,-0.077734],[-0.137369,-0.082698],[-0.134248,-0.086847],[-0.124453,-0.097544],[-0.122227,-0.099851],[-0.119835,-0.101988],[-0.117269,-0.103961],[-0.114518,-0.105775],[-0.111569,-0.107432],[-0.108405,-0.108936],[-0.09469,-0.114484],[-0.09463,-0.1145],[-0.07275,-0.11906],[-0.02975,-0.12],[-0.02425,-0.12],[0.02063,-0.1145],[0.02069,-0.114484],[0.034405,-0.108936],[0.037569,-0.107432],[0.0543,-0.099],[0.066995,-0.091],[0.0682,-0.059293],[0.06965,-0.0094],[0.06965,0.0094],[0.0682,0.059293],[0.066995,0.091],[0.060741,0.09485],[0.037569,0.107432],[0.034405,0.108936],[0.02069,0.114484],[0.02063,0.1145],[-0.0034,0.11895],[-0.0113,0.11905],[-0.06725,0.11906],[-0.07275,0.11906],[-0.09463,0.1145],[-0.09469,0.114484],[-0.108405,0.108936],[-0.111569,0.107432],[-0.114518,0.105775],[-0.117269,0.103961],[-0.119835,0.101988],[-0.128351,0.09485],[-0.131851,0.09175],[-0.137374,0.082675],[-0.138541,0.077734],[-0.1422,0.059293],[-0.143711,0.0496],[-0.143811,0.0417]]'
      footprint_padding: 0.01
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.22
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.6
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity:
    - 0.08
    - 0.0
    - 0.35
    min_velocity:
    - -0.06
    - 0.0
    - -0.35
    max_accel:
    - 0.1
    - 0.0
    - 0.6
    max_decel:
    - -0.25
    - 0.0
    - -1.0
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - StopZone
    - SlowdownZone
    StopZone:
      type: polygon
      points: '[[-0.304,-0.23],[0.38,-0.23],[0.38,0.23],[-0.304,0.23]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: '[[-0.404,-0.33],[0.58,-0.33],[0.58,0.33],[-0.404,0.33]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: collision_monitor/slowdown_zone
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      enabled: true
      source_timeout: 0.5
