bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # The upstream 20 ms default produced false action acknowledgement
    # timeouts while the Pi was servicing costmaps and Foxglove together.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # Count either translation or rotation as progress. The simple checker
      # only observes translation and falsely aborts longer in-place turns.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.03
      required_movement_angle: 0.15
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08
      lookahead_dist: 0.18
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.30
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: true
      # Commands below this value do not move the physical drivetrain
      # reliably; the goal checker stops within the configured 0.08 m radius.
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      # RPP limits rotate-to-heading from the MEASURED angular speed. At 0.60
      # a stationary pivot was asked for only ~14 ticks/s/wheel and buzzed in
      # place at the goal (14 Oct 2026, 10.9 V). 3.0 reaches 0.30 rad/s in
      # ~0.1 s; the velocity smoother still limits the final command.
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 2.0
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.30
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      footprint: '[[-0.143811,0.0383],[-0.14365,-0.0094],[-0.1422,-0.059293],[-0.138541,-0.077734],[-0.137369,-0.082698],[-0.134248,-0.086847],[-0.124453,-0.097544],[-0.122227,-0.099851],[-0.119835,-0.101988],[-0.117269,-0.103961],[-0.114518,-0.105775],[-0.111569,-0.107432],[-0.108405,-0.108936],[-0.09469,-0.114484],[-0.09463,-0.1145],[-0.07275,-0.11906],[-0.02975,-0.12],[-0.02425,-0.12],[0.02063,-0.1145],[0.02069,-0.114484],[0.034405,-0.108936],[0.037569,-0.107432],[0.0543,-0.099],[0.066995,-0.091],[0.0682,-0.059293],[0.06965,-0.0094],[0.06965,0.0094],[0.0682,0.059293],[0.066995,0.091],[0.060741,0.09485],[0.037569,0.107432],[0.034405,0.108936],[0.02069,0.114484],[0.02063,0.1145],[-0.0034,0.11895],[-0.0113,0.11905],[-0.06725,0.11906],[-0.07275,0.11906],[-0.09463,0.1145],[-0.09469,0.114484],[-0.108405,0.108936],[-0.111569,0.107432],[-0.114518,0.105775],[-0.117269,0.103961],[-0.119835,0.101988],[-0.128351,0.09485],[-0.131851,0.09175],[-0.137374,0.082675],[-0.138541,0.077734],[-0.1422,0.059293],[-0.143711,0.0496],[-0.143811,0.0417]]'  # Camera-forward CAD hull (+X towards the camera)
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "camera_voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0

      # 3D obstacles from the Astra depth camera (15 Oct 2026). Voxels of
      # 5 cm from the floor to 0.40 m; points 0.05-0.35 m above the floor mark
      # obstacles the 24 cm lidar plane misses. The camera cannot see closer
      # than ~0.5 m; the lidar covers the near field. Without the camera
      # launch this layer simply receives no data.
      camera_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 8
        max_obstacle_height: 0.40
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: camera
        camera:
          topic: /camera/obstacle_points
          data_type: "PointCloud2"
          sensor_frame: ""
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 0.35
          obstacle_min_range: 0.45
          obstacle_max_range: 2.5
          raytrace_min_range: 0.45
          raytrace_max_range: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.22
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.143811,0.0383],[-0.14365,-0.0094],[-0.1422,-0.059293],[-0.138541,-0.077734],[-0.137369,-0.082698],[-0.134248,-0.086847],[-0.124453,-0.097544],[-0.122227,-0.099851],[-0.119835,-0.101988],[-0.117269,-0.103961],[-0.114518,-0.105775],[-0.111569,-0.107432],[-0.108405,-0.108936],[-0.09469,-0.114484],[-0.09463,-0.1145],[-0.07275,-0.11906],[-0.02975,-0.12],[-0.02425,-0.12],[0.02063,-0.1145],[0.02069,-0.114484],[0.034405,-0.108936],[0.037569,-0.107432],[0.0543,-0.099],[0.066995,-0.091],[0.0682,-0.059293],[0.06965,-0.0094],[0.06965,0.0094],[0.0682,0.059293],[0.066995,0.091],[0.060741,0.09485],[0.037569,0.107432],[0.034405,0.108936],[0.02069,0.114484],[0.02063,0.1145],[-0.0034,0.11895],[-0.0113,0.11905],[-0.06725,0.11906],[-0.07275,0.11906],[-0.09463,0.1145],[-0.09469,0.114484],[-0.108405,0.108936],[-0.111569,0.107432],[-0.114518,0.105775],[-0.117269,0.103961],[-0.119835,0.101988],[-0.128351,0.09485],[-0.131851,0.09175],[-0.137374,0.082675],[-0.138541,0.077734],[-0.1422,0.059293],[-0.143711,0.0496],[-0.143811,0.0417]]'  # Camera-forward CAD hull (+X towards the camera)
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.22
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.60

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    # OPEN_LOOP (14 Oct 2026): CLOSED_LOOP ramps from measured odometry, so a
    # stationary pivot (stiction) only received ~10 ticks/s and stalled.
    feedback: "OPEN_LOOP"
    max_velocity: [0.08, 0.0, 0.35]
    min_velocity: [-0.06, 0.0, -0.35]
    # Angular 2.0 rad/s^2 (14 Oct): short final-heading corrections must reach
    # a breakaway pivot speed before RPP stops commanding them.
    max_accel: [0.10, 0.0, 2.0]
    max_decel: [-0.25, 0.0, -1.00]
    odom_topic: /odometry/filtered
    odom_duration: 0.20
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.20
    source_timeout: 0.50
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["StopZone", "SlowdownZone"]

    StopZone:
      type: "polygon"
      # Camera-forward body (front +0.070, rear -0.144 m before padding).
      # The RPLIDAR A1 discards returns closer than 0.15 m; the forward
      # boundary stays well beyond that blind radius and the nose so an
      # approaching obstacle is stopped while it is still observable.
      # Clearances come from the CAD model, not from measured stopping
      # distances.
      points: '[[-0.304,-0.23],[0.38,-0.23],[0.38,0.23],[-0.304,0.23]]'
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true

    SlowdownZone:
      type: "polygon"
      points: '[[-0.404,-0.33],[0.58,-0.33],[0.58,0.33],[-0.404,0.33]]'
      action_type: "slowdown"
      min_points: 3
      # Preserve 0.06 m/s at the 0.08 m/s navigation limit. Lower outputs
      # fall below the verified reliable motion range of this drivetrain.
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: collision_monitor/slowdown_zone
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true
      source_timeout: 0.50
