amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 0.5

    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    sigma_hit: 0.2
    lambda_short: 0.1
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    do_beamskip: false

    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    update_min_d: 0.05
    update_min_a: 0.08
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: true
    save_pose_rate: 0.5
    introspection_mode: disabled
    allow_parameter_qos_overrides: true
    bond_heartbeat_period: 0.1
