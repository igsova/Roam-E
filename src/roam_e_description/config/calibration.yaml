    rpy: [0.0, -0.0, 0.0]
    note: CAD nominal
  tof_front_r_link:
    parent: base_link
    xyz: [0.063721955, -0.067987762, 0.0075]
    rpy: [-0.0, -0.0, -0.195908174]
    note: CAD nominal
  tof_rear_l_link:
    parent: base_link
    xyz: [-0.137721956, 0.067987762, 0.0075]
    rpy: [0.0, -0.0, 2.945684433]
    note: CAD nominal
  tof_rear_c_link:
    parent: base_link
    xyz: [-0.140950009, -0.0, 0.0075]
    rpy: [0.0, -0.0, 3.141592503]
    note: CAD nominal
  tof_rear_r_link:
