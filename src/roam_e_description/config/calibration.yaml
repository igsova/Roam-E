# Frames and wheel geometry used by urdf/roam_e.urdf.xacro. The robot launch files in
# src/roam_e/launch load this file through launch/display.launch.py.
#
# Values start from the CAD model (config/calibration_cad_nominal.yaml) and are replaced
# by measurements; each frame's note says where its values come from. build_description.py
# never overwrites this file unless it is run with --reset-calibration.
#
# Each frame gives xyz (metres) and rpy (radians, roll-pitch-yaw about the fixed X, Y, Z
# axes) relative to its parent. After an edit, run tools/description/validate_description.py.
# To try other values without editing this file, pass calibration_file:=/path/to/copy.yaml
# to display.launch.py.
#
# physical_wheels sets the wheel joints, the height of base_link and the wheel mesh scale.
# effective_odometry records the floor-calibrated values that the encoder odometry node
# uses; the URDF does not read them.
forward: camera
physical_wheels:
  radius: 0.033875
  separation: 0.17363
  width: 0.029
effective_odometry:
  radius: 0.033975
  separation: 0.17515
  note: Floor-calibrated values used by the encoder odometry; not read by the URDF
frames:
  hood_side_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  hood_front_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  hood_rear_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  skirt_side_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  skirt_front_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  skirt_rear_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  battery_drawer_link:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    note: Body panel; shares the base_link origin
  laser_frame:
    parent: base_link
    xyz: [-0.02889871, 0.0, 0.190899983]
    rpy: [0.0, -0.0, 3.141592503]
    note: CAD midpoint of the LiDAR rotor; scan plane and yaw not measured
  imu_mount_link:
    parent: base_link
    xyz: [-4.0e-09, 0.0, 0.089500003]
    rpy: [0.0, -0.0, 3.141592503]
    note: CAD nominal
  imu_link:
    parent: imu_mount_link
    xyz: [4.0e-09, 0.0, 0.002000004]
    rpy: [0.0, 0.0, 1.5707963267948966]
    note: >-
      xyz: CAD centre of the BNO055 package. rpy: chip axes from axis-direction checks on the
      robot; net yaw -pi/2 from base_link, Z up
  camera_link:
    parent: base_link
    xyz: [0.067083791, 0.021466669, 0.129150003]
    rpy: [0.0, -0.0367, 0.0489]
    note: >-
      xyz: CAD centre of the depth lens. rpy: measured against the LiDAR on a flat wall at 0.70,
      1.00 and 1.50 m with tools/calibration/measure_camera_wall.py; pitched up 2.1 deg (+/-0.1)
      and turned left 2.8 deg (spread 1.8 to 4.0 deg)
  camera_rgb_optical_frame:
    parent: camera_link
    xyz: [0.0, 0.035330553, 0.0]
    rpy: [-1.570796371, -0.0, -1.570796371]
    note: CAD lens centre with REP-103 optical axes
  camera_depth_optical_frame:
    parent: camera_link
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.570796371, -0.0, -1.570796371]
    note: CAD lens centre with REP-103 optical axes
  camera_ir_optical_frame:
    parent: camera_link
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.570796371, -0.0, -1.570796371]
    note: CAD lens centre with REP-103 optical axes
  tof_front_l_link:
    parent: base_link
    xyz: [0.063721955, 0.067987762, 0.0075]
    rpy: [0.0, 0.0, 0.195908174]
    note: CAD nominal
  tof_front_c_link:
